<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RabbitFish Detector</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #dde2e8;
    --accent: #0b6bcb; --ok: #1a7f37; --bad: #c62828; --body: #e8590c; --head: #1971c2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1f25; --text: #e6e9ed; --muted: #9aa5b1; --line: #2c333b;
            --accent: #4dabf7; --ok: #3fb950; --bad: #ff6b6b; --body: #ff922b; --head: #4dabf7; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; }
  .status b { font-weight: 600; }
  .pass { color: var(--ok); } .fail { color: var(--bad); }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px; text-align: center; cursor: pointer; }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; margin-top: 12px; font-size: 14px; }
  input[type=range] { width: 160px; vertical-align: middle; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #results { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card canvas { display: block; width: 100%; height: auto; }
  .meta { padding: 10px 14px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .meta .name { color: var(--text); font-weight: 600; }
  .meta .info { display: contents; } /* its spans join .meta's flex row and get its gaps */
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>RabbitFish Detector</h1>
  <p class="sub">Fish body and head detection, running on this ESP32-S3.</p>

  <div class="panel status" id="status">Loading device info…</div>

  <div class="panel">
    <div id="drop">Drop photos here, or click to choose<input id="file" type="file" accept="image/*" multiple hidden></div>
    <div class="controls">
      <label>Confidence <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.25"> <b id="confv">0.25</b></label>
      <span class="legend"><span><i class="sw" style="background:var(--body)"></i>fishbody</span><span><i class="sw" style="background:var(--head)"></i>fishhead</span></span>
    </div>
  </div>

  <div id="results"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let input = { width: 320, height: 256 };
const css = getComputedStyle(document.documentElement);
const colors = { fishbody: css.getPropertyValue('--body').trim(), fishhead: css.getPropertyValue('--head').trim() };

async function loadInfo() {
  try {
    const info = await (await fetch('/info')).json();
    input = info.input;
    const d = info.device;
    $('status').innerHTML = [
      `<span><b>Model</b> ${info.run} · ${info.variant}</span>`,
      `<span><b>Input</b> ${input.width}×${input.height}</span>`,
      `<span><b>Self-test</b> <span class="${d.self_test_passed ? 'pass' : 'fail'}">${d.self_test_passed ? 'passed' : 'FAILED'}</span></span>`,
      `<span><b>Inference</b> ${d.boot_inference_ms} ms (${d.runtime})</span>`,
      `<span><b>Val mAP50-95</b> ${info['val_mAP50-95'].int8_simulated} (int8, simulated)</span>`,
      `<span><b>Requests</b> ${d.requests}</span>`,
    ].join('');
  } catch (e) {
    $('status').innerHTML = `<span class="err">Could not reach the device: ${e}</span>`;
  }
}

// Shrink to fit the model input (keeping the aspect ratio) and encode as JPEG, so the upload is
// small and the device never has to hold a full-size photo.
async function toUpload(bitmap) {
  const s = Math.min(1, input.width / bitmap.width, input.height / bitmap.height);
  const w = Math.round(bitmap.width * s), h = Math.round(bitmap.height * s);
  const c = new OffscreenCanvas(w, h);
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(bitmap, 0, 0, w, h);
  return { blob: await c.convertToBlob({ type: 'image/jpeg', quality: 0.92 }), scale: s };
}

function draw(canvas, bitmap, dets, scale) {
  const maxW = 1600, k = Math.min(1, maxW / bitmap.width);
  canvas.width = Math.round(bitmap.width * k);
  canvas.height = Math.round(bitmap.height * k);
  const g = canvas.getContext('2d');
  g.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const f = k / scale; // uploaded-image pixels -> displayed pixels
  const lw = Math.max(2, canvas.width / 400);
  const fontPx = Math.round(Math.max(12, canvas.width / 70));
  g.font = `600 ${fontPx}px -apple-system, sans-serif`;
  for (const d of dets) {
    const [x1, y1, x2, y2] = d.box.map((v) => v * f);
    g.strokeStyle = g.fillStyle = colors[d.class] || '#888';
    g.lineWidth = lw;
    g.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = `${d.class} ${d.score.toFixed(2)}`;
    const tw = g.measureText(label).width + 8, th = fontPx + 6;
    g.fillRect(x1, Math.max(0, y1 - th), tw, th);
    g.fillStyle = '#fff';
    g.fillText(label, x1 + 4, Math.max(th - 6, y1 - 6));
  }
}

async function run(file) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<canvas></canvas><div class="meta"><span class="name"></span><span class="info">Detecting…</span></div>`;
  card.querySelector('.name').textContent = file.name;
  $('results').prepend(card);
  const meta = card.querySelector('.info');
  try {
    const bitmap = await createImageBitmap(file);
    const { blob, scale } = await toUpload(bitmap);
    draw(card.querySelector('canvas'), bitmap, [], scale);
    const t0 = performance.now();
    const r = await fetch(`/detect?conf=${$('conf').value}`, { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
    const res = await r.json();
    if (!r.ok) throw new Error(res.error || r.status);
    const total = performance.now() - t0;
    draw(card.querySelector('canvas'), bitmap, res.detections, scale);
    const n = (c) => res.detections.filter((d) => d.class === c).length;
    const t = res.timing_ms;
    meta.innerHTML = `<span>${n('fishbody')} bodies, ${n('fishhead')} heads</span>` +
      `<span>round trip ${total.toFixed(0)} ms</span>` +
      `<span>on device: inference ${t.inference.toFixed(0)} · decode ${t.decode.toFixed(0)} · pre ${t.preprocess.toFixed(0)} · post ${t.postprocess.toFixed(0)} ms</span>` +
      `<span>upload ${res.width}×${res.height}, ${(blob.size / 1024).toFixed(0)} KB</span>`;
  } catch (e) {
    meta.innerHTML = `<span class="err">${e.message || e}</span>`;
  }
}

// One request at a time: the device runs a single model instance.
async function runAll(files) {
  for (const f of files) if (f.type.startsWith('image/')) await run(f);
  loadInfo();
}

$('conf').oninput = () => ($('confv').textContent = Number($('conf').value).toFixed(2));
$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => runAll([...e.target.files]);
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('over'); runAll([...e.dataTransfer.files]); };
loadInfo();
</script>
</body>
</html>
